# ACT baseline for the physical dinner-table mug pick-and-place skill.
# Train with:
#   .venv/bin/lerobot-train --config_path=bimanual/training/configs/act_aloha_mug.yaml

dataset:
  repo_id: local/aloha-dinner-mug
  root: outputs/aloha_mug_train
  video_backend: pyav

policy:
  type: act
  input_features:
    observation.images.global:
      type: VISUAL
      shape: [3, 256, 256]
    observation.images.left_wrist:
      type: VISUAL
      shape: [3, 256, 256]
    observation.images.right_wrist:
      type: VISUAL
      shape: [3, 256, 256]
    observation.state:
      type: STATE
      shape: [14]
  output_features:
    action:
      type: ACTION
      shape: [14]
  device: mps
  push_to_hub: false
  chunk_size: 20
  n_action_steps: 8
  # The left arm is stationary in this atomic skill. Mean/std statistics for
  # constant joints can have a few micro-units of rounding error and zero std,
  # which explodes normalized targets. Bounded min/max avoids that failure.
  normalization_mapping:
    VISUAL: MEAN_STD
    STATE: MIN_MAX
    ACTION: MIN_MAX
  optimizer_lr: 0.0001
  optimizer_lr_backbone: 0.00001

output_dir: outputs/act_aloha_mug
job_name: act_aloha_mug_20_8
seed: 1000
num_workers: 0
batch_size: 8
steps: 100000
log_freq: 200
save_checkpoint: true
save_freq: 10000
wandb:
  enable: false
