# ACT control baseline for the contact-only ALOHA 2 block dataset.
# Run with:
#   .venv/bin/lerobot-train \
#     --config_path=bimanual/training/configs/act_aloha_block.yaml

dataset:
  repo_id: local/aloha-physical-block
  root: outputs/aloha_block_train
  video_backend: pyav

policy:
  type: act
  input_features:
    observation.images.global:
      type: VISUAL
      shape: [3, 256, 256]
    observation.images.left_wrist:
      type: VISUAL
      shape: [3, 256, 256]
    observation.images.right_wrist:
      type: VISUAL
      shape: [3, 256, 256]
    observation.state:
      type: STATE
      shape: [14]
  output_features:
    action:
      type: ACTION
      shape: [14]
  device: mps
  push_to_hub: false
  chunk_size: 20
  n_action_steps: 8
  optimizer_lr: 0.0001
  optimizer_lr_backbone: 0.00001

output_dir: outputs/act_aloha_block
job_name: act_aloha_block_20_8
seed: 1000
num_workers: 0
batch_size: 8
steps: 100000
log_freq: 200
save_checkpoint: true
save_freq: 10000
wandb:
  enable: false

