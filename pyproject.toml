[project]
name = "bimanual-manipulation"
version = "0.1.0"
description = "Physical bimanual dinner-table manipulation in MuJoCo with ALOHA 2 and a legacy SO-101 profile."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mujoco>=3.10",
    "mink>=1.3.0",
    "numpy",
    "imageio[ffmpeg]",
    "huggingface_hub",
]

[project.optional-dependencies]
train = [
    "torch>=2.7,<2.12",
    "lerobot[smolvla,dataset]",
]
modal = [
    "modal",
]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bimanual"]
